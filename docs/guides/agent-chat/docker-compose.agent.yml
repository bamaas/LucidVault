# Full-stack overlay - multi-device sync + AI-agent access.
#
# EXAMPLE, not a shipped stack. Layers on the root docker-compose.yml (which is
# lucidvault-only) and adds everything for the setup in agent-chat-setup.md:
#
#   docker compose \
#     -f docker-compose.yml \
#     -f docs/guides/agent-chat/docker-compose.agent.yml \
#     up -d
#
#   lucidvault      turns the in-process MCP server ON, published on loopback
#   couchdb         + livesync-bridge - Obsidian LiveSync sync spine
#   open-terminal   runs a coding agent's CLI (Claude Code is the worked
#                   example here; Codex or any ACP agent works the same way),
#                   sandboxed, read-only vault mount
#   open-webui      the browser chat UI, wired to Open Terminal
#
# Requires in .env: ENRICH_BASE_URL, ENRICH_MODEL, COUCHDB_PASSWORD,
# OPEN_TERMINAL_API_KEY, and one of CLAUDE_CODE_OAUTH_TOKEN / ANTHROPIC_API_KEY
# (see agent-chat-setup.md for how to obtain each).

services:
  lucidvault:
    environment:
      MCP_HTTP_ADDR: ":8080"
      MCP_ALLOWED_HOST: "localhost,127.0.0.1,lucidvault"
      MCP_READ_TOOLS: "false"      # agents read vault files directly
    ports:
      # Loopback only. MCP exposes vault MUTATION tools - never bind 0.0.0.0.
      # (To let a trusted-LAN client write via MCP, publish the LAN IP instead
      #  and add that IP to MCP_ALLOWED_HOST. See the runbook's rationale.)
      - "127.0.0.1:8080:8080"

  # --- Obsidian LiveSync sync spine ---------------------------------------
  couchdb:
    image: couchdb:3
    container_name: couchdb
    environment:
      - COUCHDB_USER=${COUCHDB_USER:-admin}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:?set COUCHDB_PASSWORD in .env}
    volumes:
      - couchdb_data:/opt/couchdb/data
    ports:
      - "${COUCHDB_BIND:-127.0.0.1}:5984:5984"
    restart: unless-stopped

  livesync-bridge:
    build:
      context: deploy/livesync-bridge
    container_name: livesync-bridge
    volumes:
      - ./vault:/data/vault
      - ./deploy/livesync-bridge/config.json:/app/dat/config.json:ro
    depends_on:
      - couchdb
    restart: unless-stopped

  # --- Agent access -------------------------------------------------------
  open-terminal:
    # Official image - pulled automatically, no local build. Tag convention is
    # "<open-terminal-version>-agents". Pin an exact tag rather than tracking
    # a floating one; before bumping it, check the package page:
    #   https://github.com/open-webui/open-terminal/pkgs/container/open-terminal
    # (`docker manifest inspect ghcr.io/open-webui/open-terminal:<tag>` also works.)
    image: ghcr.io/open-webui/open-terminal:0.17.21-agents
    container_name: open-terminal
    depends_on:
      - lucidvault
    # Recommended hardening: the image grants the `user` account passwordless
    # sudo; this blocks that escalation path. Verified: does not interfere
    # with the agent CLI or MCP registration.
    security_opt:
      - no-new-privileges:true
    # Verified on a live deployment: ~316 MiB idle. Adjust for your workload.
    mem_limit: 1536m
    volumes:
      # Open Terminal's home (HOME=/home/user) - agent login, MCP registration
      # (~/.claude.json) and session state live here. Read/write, named volume
      # so they survive a container recreate.
      - open_terminal_home:/home/user
      # The vault, READ-ONLY. Writes are kernel-denied - they must go through
      # the LucidVault MCP tools. See agent-chat-setup.md for how the agent's
      # CLAUDE.md finds this path and the vault's own AGENTS.md.
      - ./vault:/home/user/vault:ro
    environment:
      OPEN_TERMINAL_API_KEY: "${OPEN_TERMINAL_API_KEY:?set OPEN_TERMINAL_API_KEY in .env}"
      # Inherited by the `claude` process Open Terminal launches. Set exactly
      # one: a token from `claude setup-token` (subscription login) or an
      # Anthropic API key. Leave the other blank in .env.
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # Working directory the agent starts in (absolute). Points at a folder
      # containing a CLAUDE.md that states the read-only boundary and imports
      # the vault's AGENTS.md (see agent-chat-setup.md, "Agent instructions").
      OPEN_TERMINAL_START_DIR: "${OPEN_TERMINAL_START_DIR:-/home/user/workspace}"
      # Open Terminal also serves a browser-automation and a desktop
      # HTTP/WebSocket endpoint; this agent only needs a terminal, so turn
      # both off to shrink the surface it exposes.
      OPEN_TERMINAL_ENABLE_BROWSER: "false"
      OPEN_TERMINAL_ENABLE_DESKTOP: "false"
    # Optional hardening: restrict the container's own outbound network to an
    # allowlist of domains. Needs NET_ADMIN to install the firewall rules.
    # cap_add:
    #   - NET_ADMIN
    # environment:
    #   OPEN_TERMINAL_ALLOWED_DOMAINS: "api.anthropic.com,github.com"
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.13.4
    container_name: open-webui
    depends_on:
      - open-terminal
    ports:
      - "0.0.0.0:3000:8080"
    environment:
      # Declarative Open Terminal connection - same effect as wiring it by
      # hand in Admin -> Settings -> Integrations -> Open Terminal.
      TERMINAL_SERVER_CONNECTIONS: >-
        [{"id":"open-terminal",
        "url":"http://open-terminal:8000",
        "key":"${OPEN_TERMINAL_API_KEY}",
        "name":"Open Terminal",
        "auth_type":"bearer",
        "config":{"access_grants":[]}}]
      # Tool-call approvals in chat (reads run free, writes/commands wait for
      # you). Verify this landed under Admin -> Settings in your version.
      ENABLE_TOOL_PERMISSIONS: "True"
      ENABLE_TOOL_PERMISSIONS_AUTO: "True"
    volumes:
      - open-webui:/app/backend/data
    restart: unless-stopped

volumes:
  couchdb_data:
  open_terminal_home:
  open-webui:
