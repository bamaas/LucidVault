# LucidVault - simple single-container setup.
#
# The pipeline scrapes/enriches URLs from the inbox and writes your vault. That's
# it. For multi-device sync (Obsidian LiveSync) and AI-agent access (browser chat
# + Claude Code over MCP), see the full-stack runbook:
#   docs/guides/agent-chat/agent-chat-setup.md

services:
  lucidvault:
    image: ghcr.io/bamaas/lucidvault:latest
    environment:
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:?OLLAMA_API_KEY is required}
      - VAULT_PATH=/vault
      - RAINDROP_ACCESS_TOKEN=${RAINDROP_ACCESS_TOKEN:-}
      - SUPADATA_API_KEY=${SUPADATA_API_KEY:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
      - POLL_INTERVAL=${POLL_INTERVAL:-}
      # Expose the in-process MCP server over HTTP (empty = off). The full-stack
      # runbook turns this on; leave empty for the plain pipeline.
      - MCP_HTTP_ADDR=${MCP_HTTP_ADDR:-}
      - MCP_ALLOWED_HOST=${MCP_ALLOWED_HOST:-}
      - MCP_READ_TOOLS=${MCP_READ_TOOLS:-}
      # Host path of the vault, for the CLAUDE.md pointer (see .env.example).
      # Only takes effect once a host CLAUDE.md is bind-mounted into the
      # container below (CLAUDE_MD_PATH, default /CLAUDE.md) -- without that
      # mount there is nothing for the pointer to be written into.
      - CLAUDE_MD_VAULT_PATH=${CLAUDE_MD_VAULT_PATH:-}
    volumes:
      - ./vault:/vault
      - db:/data
      # Uncomment to enable the CLAUDE.md pointer; requires CLAUDE_MD_VAULT_PATH
      # above. Create the file first, or Docker mounts a directory instead:
      # touch ~/.claude/CLAUDE.md
      # - ~/.claude/CLAUDE.md:/CLAUDE.md
    user: "1000:1000"
    restart: unless-stopped

volumes:
  db:
