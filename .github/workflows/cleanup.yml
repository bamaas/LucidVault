name: Cleanup

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  packages: write

jobs:
  prune-images:
    name: Prune old GHCR images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: lucidvault
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: false
