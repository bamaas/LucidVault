name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (without v prefix)
        required: true
      ci-run-id:
        description: CI workflow run ID (for Docker image artifact)
        required: true
      bump-run-id:
        description: Bump workflow run ID (for changelog artifact)
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CIBOTBM_APP_ID }}
          private-key: ${{ secrets.CIBOTBM_PRIVATE_KEY }}

      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog
          path: /tmp/bump
          run-id: ${{ inputs.bump-run-id }}
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp
          run-id: ${{ inputs.ci-run-id }}
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --repo "${{ github.repository }}" \
            --title "v${{ inputs.version }}" \
            --notes-file /tmp/bump/changelog.md

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        run: |
          docker load -i /tmp/image.tar
          repo="${GITHUB_REPOSITORY,,}"
          version="${{ inputs.version }}"
          docker tag lucidvault:ci "ghcr.io/${repo}:${version}"
          docker tag lucidvault:ci "ghcr.io/${repo}:latest"
          docker push "ghcr.io/${repo}:${version}"
          docker push "ghcr.io/${repo}:latest"
