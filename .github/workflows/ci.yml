name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - run: mise run lint:go

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - run: go test ./...

  build-image:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: lucidvault:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image
        if: github.event_name == 'push'
        run: docker save lucidvault:ci -o /tmp/image.tar

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1
