name: Bump version

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  bump:
    name: Bump version
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_commit.author.name != 'cibotbm[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CIBOTBM_APP_ID }}
          private-key: ${{ secrets.CIBOTBM_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: jdx/mise-action@v3
        with:
          install: true

      - name: Configure git
        run: |
          git config --local user.name "cibotbm[bot]"
          git config --local user.email "cibotbm[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          version_before="$(cz version --project)"
          if cz bump --yes --changelog --changelog-to-stdout > /tmp/changelog.md 2>/tmp/cz-stderr.txt; then
            version_after="$(cz version --project)"
            if [ "$version_before" != "$version_after" ]; then
              echo "bumped=true" >> "$GITHUB_OUTPUT"
              echo "version=${version_after}" >> "$GITHUB_OUTPUT"
            else
              echo "bumped=false" >> "$GITHUB_OUTPUT"
              echo "Version unchanged (${version_before}) — nothing to release."
            fi
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            cat /tmp/cz-stderr.txt
          fi

      - name: Push changes
        if: steps.bump.outputs.bumped == 'true'
        run: |
          git push
          git push --tags

      - uses: actions/upload-artifact@v4
        if: steps.bump.outputs.bumped == 'true'
        with:
          name: changelog
          path: /tmp/changelog.md
          retention-days: 1

      - name: Trigger release
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run release.yml \
            -f version=${{ steps.bump.outputs.version }} \
            -f ci-run-id=${{ github.event.workflow_run.id }} \
            -f bump-run-id=${{ github.run_id }}
