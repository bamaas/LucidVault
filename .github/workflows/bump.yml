name: Bump version

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  bump:
    name: Bump version
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_commit.author.name != 'cibotbm[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CIBOTBM_APP_ID }}
          private-key: ${{ secrets.CIBOTBM_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: jdx/mise-action@v3
        with:
          install: true

      - name: Configure git
        run: |
          git config --local user.name "cibotbm[bot]"
          git config --local user.email "cibotbm[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          if cz bump --yes --changelog --changelog-to-stdout > /tmp/changelog.md 2>/tmp/cz-stderr.txt; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "version=$(cz version --project)" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            cat /tmp/cz-stderr.txt
          fi

      - name: Push changes
        if: steps.bump.outputs.bumped == 'true'
        run: |
          git push
          git push --tags

      - name: Save bump metadata
        if: steps.bump.outputs.bumped == 'true'
        run: |
          echo "${{ github.event.workflow_run.id }}" > /tmp/ci_run_id.txt
          echo "${{ steps.bump.outputs.version }}" > /tmp/version.txt

      - uses: actions/upload-artifact@v4
        if: steps.bump.outputs.bumped == 'true'
        with:
          name: bump-metadata
          path: |
            /tmp/ci_run_id.txt
            /tmp/version.txt
            /tmp/changelog.md
          retention-days: 1
