name: Bump version

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  bump:
    name: Bump version and create release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_commit.author.name != 'cibotbm[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CIBOTBM_APP_ID }}
          private-key: ${{ secrets.CIBOTBM_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: jdx/mise-action@v3
        with:
          install: true

      - name: Configure git
        run: |
          git config --local user.name "cibotbm[bot]"
          git config --local user.email "cibotbm[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          if cz bump --yes --changelog --changelog-to-stdout > /tmp/cz-changelog.md 2>&1; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "version=$(cz version --project)" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push changes
        if: steps.bump.outputs.bumped == 'true'
        run: |
          git push
          git push --tags

      - name: Set up Go
        if: steps.bump.outputs.bumped == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        if: steps.bump.outputs.bumped == 'true'
        run: |
          platforms=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )
          for platform in "${platforms[@]}"; do
            GOOS="${platform%/*}"
            GOARCH="${platform#*/}"
            output="lucidvault-${GOOS}-${GOARCH}"
            if [ "${GOOS}" = "windows" ]; then
              output="${output}.exe"
            fi
            echo "Building ${output}..."
            GOOS="${GOOS}" GOARCH="${GOARCH}" CGO_ENABLED=0 go build -o "dist/${output}" ./cmd/main.go
          done

      - name: Create GitHub release
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            dist/* \
            --title "v${{ steps.bump.outputs.version }}" \
            --notes-file /tmp/cz-changelog.md

      - name: Download Docker image artifact
        if: steps.bump.outputs.bumped == 'true'
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Log in to GHCR
        if: steps.bump.outputs.bumped == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        if: steps.bump.outputs.bumped == 'true'
        run: |
          docker load -i /tmp/image.tar
          repo="${GITHUB_REPOSITORY,,}"
          version="${{ steps.bump.outputs.version }}"
          docker tag lucidvault:ci "ghcr.io/${repo}:${version}"
          docker tag lucidvault:ci "ghcr.io/${repo}:latest"
          docker push "ghcr.io/${repo}:${version}"
          docker push "ghcr.io/${repo}:latest"
