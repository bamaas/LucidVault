name: Bump version

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  bump:
    name: Bump version and create release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_commit.author.name != 'cibotbm[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CIBOTBM_APP_ID }}
          private-key: ${{ secrets.CIBOTBM_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: jdx/mise-action@v3
        with:
          install: true

      - name: Configure git
        run: |
          git config --local user.name "cibotbm[bot]"
          git config --local user.email "cibotbm[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          if cz bump --yes --changelog --changelog-to-stdout > /tmp/cz-changelog.md 2>&1; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "version=$(cz version --project)" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push changes
        if: steps.bump.outputs.bumped == 'true'
        run: |
          git push
          git push --tags

      - name: Create GitHub release
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            --title "v${{ steps.bump.outputs.version }}" \
            --notes-file /tmp/cz-changelog.md
